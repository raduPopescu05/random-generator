name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-code:
    runs-on: ubuntu-latest 

    steps: 
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'  

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'  

      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test  
   
