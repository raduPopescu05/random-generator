name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Check and build images for pull requests
        if: github.event_name == 'pull_request'
        run: |
          docker build --check -f docker/backend/Dockerfile .
          docker build --check -f docker/frontend/Dockerfile .
          docker build -t backend:ci -f docker/backend/Dockerfile .
          docker build -t frontend:ci -f docker/frontend/Dockerfile .

  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: run-tests
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Build x64 images
        run: |
          docker build --check -f docker/backend/Dockerfile .
          docker build --check -f docker/frontend/Dockerfile .
          docker build --platform linux/amd64 -t "backend:$IMAGE_TAG" -f docker/backend/Dockerfile .
          docker build --platform linux/amd64 -t "frontend:$IMAGE_TAG" -f docker/frontend/Dockerfile .
      - name: Save images
        run: docker save -o images.tar "backend:$IMAGE_TAG" "frontend:$IMAGE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.run_id }}
          path: images.tar
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, preprod]
    environment: ${{ matrix.environment }}
    concurrency:
      group: ecr-publish-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: ${{ matrix.environment }}
      IMAGE_TAG: ${{ github.run_number }}
      ECR_REGISTRY: 834251003876.dkr.ecr.eu-central-1.amazonaws.com
    steps:
      - name: Verify required reviewers are configured
        env:
          ENVIRONMENT_API: ${{ github.api_url }}/repos/${{ github.repository }}/environments/${{ matrix.environment }}
        run: |
          # Fail closed if this public repository's environment has no approval rule.
          curl --fail --silent --show-error "$ENVIRONMENT_API" |
            jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)'
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ github.run_id }}
      - name: Load images
        run: docker load -i images.tar
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Log in to ECR
        run: aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Push images and report their URLs
        run: |
          echo "## $TARGET_ENVIRONMENT — x64 — build $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          for service in backend frontend; do
            repository="$ECR_REGISTRY/$TARGET_ENVIRONMENT/random-generator-repository/x64/$service"
            docker tag "$service:$IMAGE_TAG" "$repository:$IMAGE_TAG"
            docker push "$repository:$IMAGE_TAG"
            docker tag "$service:$IMAGE_TAG" "$repository:latest"
            docker push "$repository:latest"
            echo "$service: $repository:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          done
