name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Check and build images
        run: |
          docker build --check -f docker/backend/Dockerfile .
          docker build --check -f docker/frontend/Dockerfile .
          docker build -t backend:ci -f docker/backend/Dockerfile .
          docker build -t frontend:ci -f docker/frontend/Dockerfile .

      - name: Show publication options
        env:
          WORKFLOWS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows
        run: |
          {
            echo '## CI passed. Do you want to publish?'
            echo
            echo '- **No:** nothing else to do. This CI run completes successfully.'
            echo "- [Publish Dev]($WORKFLOWS_URL/publish-dev.yml)"
            echo "- [Publish Preprod]($WORKFLOWS_URL/publish-preprod.yml)"
            echo
            echo 'These links open the workflows; they do not start publication.'
            echo 'Choose Run workflow, select main, and start the desired workflow.'
            echo 'Publication checks the main commit selected when you start it, then builds and publishes after environment approval.'
            echo 'For a pull request, merge it first to publish its changes. The publication workflows must exist on main.'
          } >> "$GITHUB_STEP_SUMMARY"
