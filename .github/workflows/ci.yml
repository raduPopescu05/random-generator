name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to publish images to
        required: true
        default: dev
        type: choice
        options:
          - dev
          - preprod
      architecture:
        description: Image architecture to publish to ECR
        required: true
        default: arm
        type: choice
        options:
          - x64
          - arm

jobs:
  build-code:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Check and build images for automatic runs
        if: github.event_name != 'workflow_dispatch'
        run: |
          docker build --check .
          docker build --check -f frontend/Dockerfile .
          docker build -t backend:ci .
          docker build -t frontend:ci -f frontend/Dockerfile .

  build-dockerfile-and-push-to-ECR:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: ${{ inputs.target_environment }}
    env:
      IMAGE_TAG: ${{ github.run_number }}
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Check Dockerfile for backend
        run: docker build --check .

      - name: Check Dockerfile for frontend
        run: docker build --check -f frontend/Dockerfile .

      - name: Select image environment and architecture
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            dev|preprod) ;;
            *) echo "Unsupported environment: $TARGET_ENVIRONMENT" >&2; exit 1 ;;
          esac
          case "$ARCHITECTURE" in
            x64) platform=linux/amd64 ;;
            arm) platform=linux/arm64 ;;
            *) echo "Unsupported architecture: $ARCHITECTURE" >&2; exit 1 ;;
          esac
          echo "IMAGE_PLATFORM=$platform" >> "$GITHUB_ENV"
          echo "ECR_IMAGE_PREFIX=834251003876.dkr.ecr.eu-central-1.amazonaws.com/$TARGET_ENVIRONMENT/random-generator-repository/$ARCHITECTURE" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Image
        run: docker buildx build --platform "$IMAGE_PLATFORM" --load --tag "backend:$IMAGE_TAG" --tag backend:latest .

      - name: Build frontend Image
        run: docker buildx build --platform "$IMAGE_PLATFORM" --load --tag "frontend:$IMAGE_TAG" --tag frontend:latest -f frontend/Dockerfile .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Authenticate with Amazon ECR
        run: aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 834251003876.dkr.ecr.eu-central-1.amazonaws.com

      - name: Push backend image
        run: |
          docker tag "backend:$IMAGE_TAG" "$ECR_IMAGE_PREFIX/backend:$IMAGE_TAG"
          docker push "$ECR_IMAGE_PREFIX/backend:$IMAGE_TAG"
          docker tag backend:latest "$ECR_IMAGE_PREFIX/backend:latest"
          docker push "$ECR_IMAGE_PREFIX/backend:latest"

      - name: Push frontend image
        run: |
          docker tag "frontend:$IMAGE_TAG" "$ECR_IMAGE_PREFIX/frontend:$IMAGE_TAG"
          docker push "$ECR_IMAGE_PREFIX/frontend:$IMAGE_TAG"
          docker tag frontend:latest "$ECR_IMAGE_PREFIX/frontend:latest"
          docker push "$ECR_IMAGE_PREFIX/frontend:latest"
