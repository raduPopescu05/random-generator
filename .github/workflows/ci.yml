name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-code:
    runs-on: ubuntu-latest 

    steps: 
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'  

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'  

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test  
   
  build-dockerfile-and-push-to-ECR:
    needs: run-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development

    # env:
    #   AWS_REGION: eu-central-1
    #   IMAGE_TAG: ${{ github.run_number }}
    #   ECR_REGISTRY: 834251003876.dkr.ecr.eu-central-1.amazonaws.com
    #   BACKEND_IMAGE: 834251003876.dkr.ecr.eu-central-1.amazonaws.com/dev/random-generator-repository/backend
    #   FRONTEND_IMAGE: 834251003876.dkr.ecr.eu-central-1.amazonaws.com/dev/random-generator-repository/frontend

    env:
      AWS_REGION: ${{ vars.AWS_REGION }} 
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}
      FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
      IMAGE_TAG: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Dockerfile
        run: docker build --check -t random-generator-api:check .

      - name: Check frontend Dockerfile
        run: docker build --check -t random-generator-web:check -f frontend/Dockerfile .
        
      - name: Build backend Docker image
        run: docker build --tag "$BACKEND_IMAGE:$IMAGE_TAG" --tag "$BACKEND_IMAGE:latest" .

      - name: Build frontend Docker image
        run: docker build --file frontend/Dockerfile --tag "$FRONTEND_IMAGE:$IMAGE_TAG" --tag "$FRONTEND_IMAGE:latest" .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_access_key }}
          aws-secret-access-key: ${{ secrets.AWS_secret_key }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker with Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"        

      - name: Push backend image
        run: |
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"
          docker push "$BACKEND_IMAGE:latest"

      - name: Push frontend image
        run: |
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
          docker push "$FRONTEND_IMAGE:latest"



