name: CI

on:
  push:
    branches: [ main, app-fix-v1 ]
  pull_request:
    branches: [ main ]


jobs:
  build-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Check and build images for pull requests
        if: github.event_name == 'pull_request'
        run: |
          docker build --check .
          docker build --check -f frontend/Dockerfile .
          docker build -t backend:ci .
          docker build -t frontend:ci -f frontend/Dockerfile .

  build-dockerfile-and-push-to-ECR:
    if: github.event_name == 'push'
    environment: preprod
    env:
      IMAGE_TAG : ${{ github.run_number }}
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Check Dockerfile for backend
        run: docker build --check .

      - name: Check Dockerfile for frontend
        run: docker build --check -f frontend/Dockerfile .

      - name: Build backend Image
        run: docker build --tag "backend:$IMAGE_TAG" --tag backend:latest .

      - name: Build frontend Image
        run: docker build --tag "frontend:$IMAGE_TAG" --tag frontend:latest -f frontend/Dockerfile .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Authenticate with Amazon ECR
        run: aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 834251003876.dkr.ecr.eu-central-1.amazonaws.com

      - name: Push backend image
        run: |
          docker tag "backend:$IMAGE_TAG" "834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/backend:$IMAGE_TAG"
          docker push "834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/backend:$IMAGE_TAG"
          docker tag backend:latest 834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/backend:latest
          docker push 834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/backend:latest

      - name: Push frontend image
        run: |
          docker tag "frontend:$IMAGE_TAG" "834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/frontend:$IMAGE_TAG"
          docker push "834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/frontend:$IMAGE_TAG"
          docker tag frontend:latest 834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/frontend:latest
          docker push 834251003876.dkr.ecr.eu-central-1.amazonaws.com/preprod/random-generator-repository/x64/frontend:latest
