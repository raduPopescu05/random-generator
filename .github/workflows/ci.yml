name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

  run-tests:
    needs: build-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null config --quiet

      - name: Check and build images
        run: |
          docker build --check -f docker/backend/Dockerfile .
          docker build --check -f docker/frontend/Dockerfile .
          docker build -t backend:ci -f docker/backend/Dockerfile .
          docker build -t frontend:ci -f docker/frontend/Dockerfile .
