# Chart 1.14.1 / controller v2.14.1. deploy.py substitutes applied Terraform outputs.
clusterName: "__CLUSTER_NAME__"
region: "__REGION__"
vpcId: "__VPC_ID__"
replicaCount: 1
image:
  tag: v2.14.1
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: "__CONTROLLER_ROLE_ARN__"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi
# The chart generates webhook certificates; no cert-manager deployment needed.
enableCertManager: false
# This deployment exposes apps through Ingress, not LoadBalancer Services.
enableServiceMutatorWebhook: false
