global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: random-generator-api
    static_configs:
      - targets: ["api-blue:3000"]
        labels: {release_color: blue}
      - targets: ["api-green:3000"]
        labels: {release_color: green}
  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]
