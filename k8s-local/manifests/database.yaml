apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: random-generator
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: random-generator
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: {name: database, key: DB_NAME}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: {name: database, key: DB_USER}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: database, key: DB_PASSWORD}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: database, key: MYSQL_ROOT_PASSWORD}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping --protocol=tcp -h 127.0.0.1 --silent']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1"']
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping --protocol=tcp -h 127.0.0.1 --silent']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
