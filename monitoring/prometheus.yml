global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: random-generator-api
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["api:3000"]
  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]
