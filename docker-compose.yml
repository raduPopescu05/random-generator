services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: random_generator
      MYSQL_USER: random_app
      MYSQL_PASSWORD: change-me-app-password
      MYSQL_ROOT_PASSWORD: change-me-root-password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    image: 834251003876.dkr.ecr.eu-central-1.amazonaws.com/dev/random-generator-repository/backend:latest
    expose:
      - "3000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: random_generator
      DB_USER: random_app
      DB_PASSWORD: change-me-app-password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    image: 834251003876.dkr.ecr.eu-central-1.amazonaws.com/dev/random-generator-repository/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
